services:
  frontend:
    build: .
    container_name: catadventure
    restart: unless-stopped
    networks:
      - traefik-public
    environment:
      - PORT=${PORT:-8004}
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.catadv-web.rule=Host(`catadventure.cloudfr.net`)"
      - "traefik.http.routers.catadv-web.middlewares=catadv-redirect"
      - "traefik.http.middlewares.catadv-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.catadv-redirect.redirectscheme.permanent=true"
      # HTTPS router
      - "traefik.http.routers.catadv-web-secure.rule=Host(`catadventure.cloudfr.net`)"
      - "traefik.http.routers.catadv-web-secure.tls=true"
      - "traefik.http.routers.catadv-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.catadv-web-secure.service=catadv-web"
      # Service — le port est injecté via variable d'environnement
      - "traefik.http.services.catadv-web.loadbalancer.server.port=${PORT:-8004}"

networks:
  traefik-public:
    external: true
